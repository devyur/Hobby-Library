name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after ~7 days with no API activity
# (see _docs/plan.md's tech-stack section). This pings the project daily —
# comfortably under that threshold.
#
# The ping targets `categories` via PostgREST. That table only grants
# SELECT to the `authenticated` role (see
# supabase/migrations/20260908123222_create_reference_tables.sql), so an
# anon-key request gets rejected with a 401 "permission denied" by
# PostgREST/RLS before it becomes a real read. A rejected request like that
# is NOT evidence Supabase's auto-pause inactivity clock was reset — it does
# not count as activity, which is exactly what let this workflow silently
# fail to prevent a real pause for over a week. So this ping uses the
# service-role key instead, which bypasses RLS and gets a genuine
# authenticated row back. SUPABASE_URL stays a public repo variable
# (Settings > Secrets and variables > Actions > Variables), but the
# service-role key is sensitive (full admin access) and is stored as a
# repo secret (Settings > Secrets and variables > Actions > Secrets), never
# a variable.
#
# The job only succeeds on a genuine 2xx with real data — any other status
# (4xx, 5xx, 1xx, or no response at all) fails the job, since only a
# genuine successful authenticated read is proof the inactivity clock was
# reset.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL repo variable or SUPABASE_SERVICE_ROLE_KEY repo secret is not set."
            exit 1
          fi

          http_status=$(curl -sS \
            --max-time 15 \
            -o /tmp/response.json \
            -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          curl_exit=$?

          echo "HTTP status: ${http_status}"
          cat /tmp/response.json
          echo

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::curl failed to reach Supabase (exit code ${curl_exit})."
            exit 1
          fi

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Supabase did not return a successful (2xx) status (${http_status}) — a rejected or errored request does not count as activity."
            exit 1
          fi

          echo "Reached Supabase project API with an authenticated read — activity recorded."
